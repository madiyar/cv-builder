# Sveltia CMS config — https://github.com/sveltia/sveltia-cms
#
# IMPORTANT: after you deploy your own copy of this template, change `repo`
# below to `your-github-username/your-repo-name`. This is what scopes the
# editor to *your* repository, and only someone with push access to it will
# be able to sign in and save changes.
backend:
  name: github
  repo: your-username/your-repo-name
  branch: main

media_folder: 'public/uploads'
public_folder: '/uploads'

collections:
  - name: 'resume'
    label: 'Resume'
    files:
      - file: 'src/data/resume.json'
        label: 'Resume'
        name: 'resume'
        format: 'json'
        fields:
          - label: 'Basics'
            name: 'basics'
            widget: object
            fields:
              - { label: 'Name', name: 'name', widget: string }
              - { label: 'Label', name: 'label', widget: string }
              - { label: 'Email', name: 'email', widget: string }
              - { label: 'Website URL', name: 'url', widget: string }
              - { label: 'Summary', name: 'summary', widget: text }
              - label: 'Location'
                name: 'location'
                widget: object
                fields:
                  - { label: 'City', name: 'city', widget: string }
                  - { label: 'Country Code', name: 'countryCode', widget: string }
              - label: 'Profiles'
                name: 'profiles'
                widget: list
                fields:
                  - { label: 'Network', name: 'network', widget: string }
                  - { label: 'Username', name: 'username', widget: string }
                  - { label: 'URL', name: 'url', widget: string }

          - label: 'Work Experience'
            name: 'work'
            widget: list
            fields:
              - { label: 'Company', name: 'name', widget: string }
              - { label: 'Company URL', name: 'url', widget: string, required: false }
              - { label: 'Position', name: 'position', widget: string }
              - label: 'Location'
                name: 'location'
                widget: object
                fields:
                  - { label: 'City', name: 'city', widget: string }
                  - { label: 'Country Code', name: 'countryCode', widget: string }
              - { label: 'Start Date', name: 'startDate', widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
              - { label: 'End Date (leave empty if current)', name: 'endDate', widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
              - label: 'Projects'
                name: 'projects'
                widget: list
                fields:
                  - { label: 'Name', name: 'name', widget: string }
                  - { label: 'Stack', name: 'stack', widget: string, required: false }
                  - label: 'Highlights'
                    name: 'highlights'
                    widget: list
                    field: { label: 'Highlight', name: 'item', widget: text }

          - label: 'Education'
            name: 'education'
            widget: list
            fields:
              - { label: 'Institution', name: 'institution', widget: string }
              - { label: 'Institution URL', name: 'url', widget: string, required: false }
              - { label: 'Area', name: 'area', widget: string }
              - { label: 'Study Type', name: 'studyType', widget: string }
              - label: 'Location'
                name: 'location'
                widget: object
                fields:
                  - { label: 'City', name: 'city', widget: string }
                  - { label: 'Country Code', name: 'countryCode', widget: string }
              - { label: 'Start Date', name: 'startDate', widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
              - { label: 'End Date', name: 'endDate', widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
              - { label: 'Score', name: 'score', widget: string, required: false }

          - label: 'Skills'
            name: 'skills'
            widget: list
            fields:
              - { label: 'Name', name: 'name', widget: string }
              - { label: 'Keywords', name: 'keywords', widget: list, field: { label: 'Keyword', name: 'keyword', widget: string } }

          - label: 'Languages'
            name: 'languages'
            widget: list
            fields:
              - { label: 'Language', name: 'language', widget: string }
              - { label: 'Fluency', name: 'fluency', widget: string }

          - label: 'Projects'
            name: 'projects'
            widget: list
            fields:
              - { label: 'Name', name: 'name', widget: string }
              - { label: 'URL', name: 'url', widget: string, required: false }
              - { label: 'Summary', name: 'summary', widget: text, required: false }
              - { label: 'Keywords', name: 'keywords', widget: list, field: { label: 'Keyword', name: 'keyword', widget: string } }
