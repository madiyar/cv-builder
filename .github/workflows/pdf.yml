name: Build resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'src/data/resume.json'
      - 'resume/template.tex'
      - 'resume/build.mjs'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build_pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: JSON -> LaTeX
        run: npm run resume:build

      - name: LaTeX -> PDF
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: resume
          root_file: resume.tex

      - name: Collect output
        run: |
          mkdir -p resume/dist
          mv resume/resume.pdf resume/dist/cv.pdf

      - name: Deploy PDF to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: gh-pages
          folder: resume/dist
          clean: true
